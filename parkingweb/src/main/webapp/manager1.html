<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者介面 · 停車管理</title>
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
        
        /* 1. 加深全網頁背景色，與白色容器拉開強烈對比 */
        body { background: #d2e4f5; padding: 24px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* 2. 強化主容器的邊框粗細與顏色 */
        .container { max-width: 1360px; width: 100%; background: #ffffff; border-radius: 24px; padding: 35px; border: 2px solid #1a364d; box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        
        /* 3. 標題與底線改為「極深藍黑色」(#112233) 提升對比度 */
        .app-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #112233; padding-bottom: 18px; flex-wrap: wrap; gap: 12px; margin-bottom: 15px; }
        .app-header h1 { font-size: 26px; font-weight: 800; color: #112233; }
        .app-header h1 i { color: #1a4a75; margin-right: 10px; }
        .sub-title { font-size: 16px; color: #1a364d; font-weight: 700; margin-bottom: 24px; }
        .sub-title i { margin-right: 6px; }
        
        /* 4. 查詢卡片背景稍微加深，與白色網頁背景形成明顯區隔 */
        .query-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-bottom: 24px; }
        .query-card { background: #e2effa; border-radius: 16px; padding: 20px; border: 2px solid #8cb1cf; }
        .query-card h3 { font-size: 16px; font-weight: 800; color: #0f2438; margin-bottom: 15px; }
        .query-card h3 i { color: #1a4a75; margin-right: 6px; }
        
        /* 5. 輸入框標籤使用純黑色文字，確保絕對清晰 */
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .input-group label { font-size: 15px; font-weight: 800; color: #000000; }
        
        /* 6. 輸入框外框加粗 (2px) 且改為深色，內部文字使用高對比黑字 */
        .input-group select, .input-group input { width: 100%; padding: 10px 16px; border: 2px solid #112233; border-radius: 8px; font-size: 14px; background: #ffffff; color: #000000; font-weight: 600; outline: none; }
        .input-group select:focus, .input-group input:focus { border-color: #0056b3; box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.25); }
        
        /* 7. 主要按鈕採用高飽和度深藍色底、白字；邊框與文字對比極大 */
        .btn { background: #ffffff; border: 2px solid #112233; padding: 8px 20px; border-radius: 30px; font-size: 14px; color: #112233; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; }
        .btn-primary { background: #112233; border: 2px solid #112233; color: #ffffff; }
        .btn-primary:hover { background: #234567; border-color: #234567; }
        .btn-sm { padding: 6px 18px; font-size: 13px; }
        
        /* 8. 輔助提示文字顏色加深 */
        .hint-text { margin-top: 8px; font-size: 13px; color: #2c4a61; font-weight: 600; }
        
        /* 底部按鈕區塊（完美右對比） */
        .button-footer-row { display: flex; width: 100%; margin-top: 10px; }
        .btn-move-right { margin-left: auto; }

        @media (max-width: 640px) { .container { padding: 20px; } .query-grid { grid-template-columns: 1fr; } }
    </style>
</head>

<body>
<div class="container">

    <!-- 頂部標題區 -->
    <div class="app-header">
        <h1><i class="fas fa-parking"></i>幸福社區地下車場 e居家管理者介面</h1>
    </div>
    
	<div class="sub-title d-flex align-items-center w-100" style="display: flex !important;">
        <div>
        <i class="fas fa-parking"></i> 請依照下列選單功能查詢住戶資料                                   
        </div>
	    <label id="loginuser" style="margin-left: auto !important;">登入帳號</label>
	</div>

    <!-- 三種查詢卡片網格 -->
    <div class="query-grid">

        <!-- 卡片 1 -->
        <div class="query-card">
            <h3><i class="fas fa-car"></i> 使用車號查詢</h3>
            <div class="input-group">
                <label>車號</label>
                <input id="licenscplatenumber" type="text" placeholder="請輸入車號" value="ABC-1234">

            <div style="display: flex; justify-content: flex-end;">
                <button class="btn btn-primary btn-sm" onclick="callRest('車號查詢')"><i class="fas fa-search"></i> 查詢</button>
            </div>
            <div class="hint-text"><i class="fas fa-chevron-circle-right"></i> 範例: ABC-1234</div>
        </div>

        <!-- 卡片 2 -->

            <h3><i class="fas fa-home"></i> 使用門牌查詢</h3>
            <div class="input-group">
                <label>門牌</label>
                <select id="doorplateSelect"><option value="">載入中...</option></select>
            </div>
            <div style="display: flex; justify-content: flex-end;">
                <button class="btn btn-primary btn-sm" onclick="callRest('門牌查詢')"><i class="fas fa-search"></i> 查詢</button>

        </div>

        <!-- 卡片 3 -->
        <div class="query-card">
            <h3><i class="fas fa-parking"></i> 使用車位查詢</h3>
            <div class="input-group">
                <label>車位號</label>
                <select id="parkingnumberSelect"><option value="">載入中...</option></select>
            </div>
            <div style="display: flex; justify-content: flex-end;">
                <button class="btn btn-primary btn-sm" onclick="callRest('車位查詢')"><i class="fas fa-search"></i> 查詢</button>
            </div>
        </div>

    </div>

    <!-- 🟢 按鈕完美移至最右側（同時加大與上方的明暗對比） -->
	<div class="d-flex justify-content-end w-100 gap-2">
		<button class="btn btn-primary btn-sm" onclick="superadmin(event)">
		    <i class="fas fa-search"></i>保全/超級管理員
		</button>
		
		<button class="btn btn-primary btn-sm" onclick="manager2(event)">
		    <i class="fas fa-search"></i>批量查詢住戶及停車資訊
		</button>

	</div>

</div>









<!-- 🌟 寬度優化：max-width 同步改為 1360px，並移除 width: 95%，確保與上半部查詢表完全一樣寬 -->
<div id="reportSection" style="display: none; max-width: 1360px; width: 100%; margin: 30px auto; background: #ffffff; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 3px solid #000000;">
    
    <!-- 頂部大標題 -->
    <div style="border-bottom: 4px solid #000000; padding-bottom: 12px; margin-bottom: 25px;">
        <h2 style="color: #000000; margin: 0; font-size: 26px; font-weight: 900;"><i class="fas fa-file-alt"></i> 住戶車位基本資料</h2>
    </div>
    
    <!-- 🟢 1. 更新住戶資料按鈕：寬度改為 100% 滿版，完美靠最右側 -->
    <div style="width: 100%; margin: 0 0 20px 0; display: flex; justify-content: flex-end;">
        <button type="button" onclick="goToUpdatePage()" style="padding: 10px 24px; font-size: 16px; background-color: #000000; color: #ffffff; border: 2px solid #000000; border-radius: 30px; cursor: pointer; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: background 0.1s;">
            <i class="fas fa-edit"></i> 更新住戶資料
        </button>
    </div>
	
    <!-- 💡 網格佈局：2欄精準對稱，套用唯讀與編輯的高對比框線 -->
    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px 30px; background: #eef7ff; padding: 30px; border-radius: 16px; border: 2px solid #000000; margin-bottom: 35px;">
        
        <!-- 完整地址 (獨佔一行) -->
        <div style="grid-column: span 2;">
            <label style="display: block; margin-bottom: 8px; font-weight: 900; color: #000000; font-size: 15px;">完整地址</label>
            <div id="addressComplete" style="background-color: #bcd1e3; color: #000000; font-weight: 800; padding: 12px 16px; border-radius: 8px; border: 2px solid #000000; min-height: 48px; font-size: 16px; display: flex; align-items: center;"></div>
        </div>
        
        <!-- 住戶代碼 -->
        <div>
            <label style="display: block; margin-bottom: 8px; font-weight: 900; color: #000000; font-size: 15px;">住戶代碼 (主鍵不可改)</label>
            <div id="residentId" style="background-color: #bcd1e3; color: #000000; font-weight: 800; padding: 12px 16px; border-radius: 8px; border: 2px solid #000000; min-height: 48px; font-size: 16px; display: flex; align-items: center;"></div>
        </div>
        
        <!-- 簡短地址 -->
        <div>
            <label style="display: block; margin-bottom: 8px; font-weight: 900; color: #000000; font-size: 15px;">簡短地址</label>
            <div id="addressSimple" style="background-color: #bcd1e3; color: #000000; font-weight: 800; padding: 12px 16px; border-radius: 8px; border: 2px solid #000000; min-height: 48px; font-size: 16px; display: flex; align-items: center;"></div>
        </div>
        
        <!-- 車位號碼 -->
        <div>
            <label style="display: block; margin-bottom: 8px; font-weight: 900; color: #000000; font-size: 15px;">車位號碼</label>
            <div id="parkingSpaceNumber" style="background-color: #bcd1e3; color: #000000; font-weight: 800; padding: 12px 16px; border-radius: 8px; border: 2px solid #000000; min-height: 48px; font-size: 16px; display: flex; align-items: center;"></div>
        </div>
        
        <!-- 車位樓層 -->
        <div>
            <label style="display: block; margin-bottom: 8px; font-weight: 900; color: #000000; font-size: 15px;">車位樓層</label>
            <div id="parkingSpaceFloor" style="background-color: #bcd1e3; color: #000000; font-weight: 800; padding: 12px 16px; border-radius: 8px; border: 2px solid #000000; min-height: 48px; font-size: 16px; display: flex; align-items: center;"></div>
        </div>
        
        <!-- 車位所有權人 -->
        <div>
            <label style="display: block; margin-bottom: 8px; font-weight: 900; color: #000000; font-size: 15px;">車位所有權人</label>
            <div id="parkingSpaceOwner" style="background-color: #ffffff; color: #000000; font-weight: 800; padding: 12px 16px; border-radius: 8px; border: 2px solid #000000; min-height: 48px; font-size: 16px; display: flex; align-items: center;"></div>
        </div>
        
        <!-- 所有權人電話 -->
        <div>
            <label style="display: block; margin-bottom: 8px; font-weight: 900; color: #000000; font-size: 15px;">所有權人電話</label>
            <div id="parkingSpaceOwnerPhone" style="background-color: #ffffff; color: #000000; font-weight: 800; padding: 12px 16px; border-radius: 8px; border: 2px solid #000000; min-height: 48px; font-size: 16px; display: flex; align-items: center;"></div>
        </div>
        
        <!-- 車位使用者 -->
        <div>
            <label style="display: block; margin-bottom: 8px; font-weight: 900; color: #000000; font-size: 15px;">車位使用者</label>
            <div id="parkingSpaceUser" style="background-color: #ffffff; color: #000000; font-weight: 800; padding: 12px 16px; border-radius: 8px; border: 2px solid #000000; min-height: 48px; font-size: 16px; display: flex; align-items: center;"></div>
        </div>
        
        <!-- 使用者電話 -->
        <div>
            <label style="display: block; margin-bottom: 8px; font-weight: 900; color: #000000; font-size: 15px;">使用者電話</label>
            <div id="parkingSpaceUserPhone" style="background-color: #ffffff; color: #000000; font-weight: 800; padding: 12px 16px; border-radius: 8px; border: 2px solid #000000; min-height: 48px; font-size: 16px; display: flex; align-items: center;"></div>
        </div>
        
    </div>

    <!-- 🟢 2. 更新車輛資料按鈕：寬度滿版，完美靠右 -->
    <div style="width: 100%; margin: 20px 0 20px 0; display: flex; justify-content: flex-end;">
        <button type="button" onclick="goToUpdateCar()" style="padding: 10px 24px; font-size: 16px; background-color: #000000; color: #ffffff; border: 2px solid #000000; border-radius: 30px; cursor: pointer; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: background 0.1s;">
            <i class="fas fa-edit"></i> 更新車輛資料
        </button>
    </div>
	
    <!-- 表格大標題 -->
    <h3 style="color: #000000; border-bottom: 4px solid #000000; padding-bottom: 12px; margin-bottom: 20px; font-size: 22px; font-weight: 900;"><i class="fas fa-car"></i> 名下車輛登記清單</h3>
    
    <!-- 車輛表格 -->
    <table style="width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 16px; border: 2px solid #000000;">
        <thead>
            <tr style="background-color: #000000; color: #ffffff;">
                <th style="padding: 18px 15px; border: 2px solid #000000; text-align: center; width: 10%; font-weight: 900;">序號</th>
                <th style="padding: 18px 15px; border: 2px solid #000000; text-align: center; width: 20%; font-weight: 900;">車牌號碼</th>
                <th style="padding: 18px 15px; border: 2px solid #000000; text-align: left; width: 25%; padding-left: 25px; font-weight: 900;">車輛使用者</th>
                <th style="padding: 18px 15px; border: 2px solid #000000; text-align: left; width: 30%; padding-left: 25px; font-weight: 900;">聯絡電話</th>
                <th style="padding: 18px 15px; border: 2px solid #000000; text-align: center; width: 15%; font-weight: 900;">在位狀態</th>
            </tr>
        </thead>
        <tbody id="carTableBody" style="color: #000000; font-weight: 700;">
            <!-- 這裡預留給 JS 跑迴圈塞車輛資料 -->
        </tbody>
    </table>
</div>


















<script>

// 取出後端存的Token
	const token = localStorage.getItem("my_api_token");
	console.log("這裡是manager1.html抓取到的Token\t"+token)
	// AP基礎路徑
    const API_BASE = sessionStorage.getItem('API_BASE');
    document.getElementById("loginuser").innerHTML =  "登入帳號: " + sessionStorage.getItem('account') + "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;" + "等級: " + sessionStorage.getItem('class1');
    
    
    //透過後端API確認身分權限
    function superadmin(e) {
        if(e) e.preventDefault(); 
        fetch(API_BASE + '/validation', { 
            method: 'GET', 
            headers: { 
                'Authorization': `Bearer ${token}` 
            }
        })
        .then(res => {
            // 過濾器回傳 401 或 403，res.ok 就會是 false，直接丟出錯誤
            if (!res.ok) {
                if (res.status === 401 || res.status === 403) {
                    throw new Error("您沒有權限！");
                }
                throw new Error("伺服器連線失敗A");
            }
            return res.json();
        })
        .then(data => {
            // 到這裡過濾器已經放行狀態碼200驗證成功
            window.open("superadmin.html", "_blank"); 
        })
        .catch(err => {
            console.error(err);
            // 錯誤提示（包含權限不足或網路失敗）
            alert("驗證失敗：" + err.message);
        });
    }

    
 
 
    
  //透過後端API確認身分權限
    function manager2(e) {
        if(e) e.preventDefault(); 
        fetch(API_BASE + '/validation', { 
            method: 'GET', 
            headers: { 
                'Authorization': `Bearer ${token}` 
            }
        })
        .then(res => {
            if (!res.ok) {
                if (res.status === 401 || res.status === 403) {
                    throw new Error("您沒有管理員權限！");
                }
                throw new Error("伺服器連線失敗A");
            }
            return res.json();
        })
        .then(data => {
            window.open("manager2.html", "_blank"); 
        })
        .catch(err => {
            console.error(err);
            alert("驗證失敗：" + err.message);
        });
    }
 
 
    
    
    
    async function callRest(action) {
        let apiUrl = '';
        let selectedValue = '';
        if (action === '車號查詢') {
            const selectPlate = document.getElementById('licenscplatenumber');
            if (!selectPlate) return alert("網頁找不到 id='licenscplatenumber' 的輸入框");
            selectedValue = selectPlate.value;
            if (!selectedValue) return alert('請輸入車號！');
            apiUrl = `${API_BASE}/getresidentbylicenseplatenumber/${encodeURIComponent(selectedValue)}`;
        }
        if (action === '門牌查詢') {
        	const selectPlate = document.getElementById('doorplateSelect');
            if (!selectPlate) return alert("網頁找不到 id='doorplateSelect' 的選單");
            selectedValue = selectPlate.value;
            if (!selectedValue) return alert('請選擇門牌！');
            apiUrl = `${API_BASE}/getresidentbyaddresssimple/${encodeURIComponent(selectedValue)}`;
        }
        if (action === '車位查詢') {
            const selectPlate = document.getElementById('parkingnumberSelect');
            if (!selectPlate) return alert("網頁找不到 id='parkingnumberSelect' 的選單");
            selectedValue = selectPlate.value;
            if (!selectedValue) return alert('請選擇車位號！');
            apiUrl = `${API_BASE}/getresidentbyparkingspacenumber/${encodeURIComponent(selectedValue)}`;
        }   
        if (apiUrl !== '') {
            try {
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (!response.ok) throw new Error('HTTP 錯誤狀態: ' + response.status);
	            const data = await response.json(); //拿Java 回傳的 map 物件
                if (data.success && data.resident) {
                    const res = data.resident;
                    // 1. 住戶基本資料送進 HTML對應的id標籤
                    document.getElementById('residentId').textContent = res.residentId || '';
                    document.getElementById('addressSimple').textContent = res.addressSimple || '';
                    document.getElementById('addressComplete').textContent = res.addressComplete || '';
                    document.getElementById('parkingSpaceOwner').textContent = res.parkingSpaceOwner || '';
                    document.getElementById('parkingSpaceUser').textContent = res.parkingSpaceUser || '';
                    document.getElementById('parkingSpaceNumber').textContent = res.parkingSpaceNumber || '';
                    document.getElementById('parkingSpaceFloor').textContent = res.parkingSpaceFloor || '';
                    document.getElementById('parkingSpaceOwnerPhone').textContent = res.parkingSpaceOwnerPhone || '';
                    document.getElementById('parkingSpaceUserPhone').textContent = res.parkingSpaceUserPhone || '';

                    // 2. 清空並重新繪製車輛表格
                    const tbody = document.getElementById('carTableBody');
                    tbody.innerHTML = ''; 

                    if (data.carregistration && data.carregistration.length > 0) {
                        data.carregistration.forEach(car => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td style="padding: 12px; border: 1px solid #ddd;">${car.carSerialNumber || ''}</td>
                                <td style="padding: 12px; border: 1px solid #ddd; font-weight: bold; color: #2c3e50;">${car.licensePlateNumber || ''}</td>
                                <td style="padding: 12px; border: 1px solid #ddd;">${car.carUser || ''}</td>
                                <td style="padding: 12px; border: 1px solid #ddd;">${car.carUserPhone || ''}</td>
                                <td style="padding: 12px; border: 1px solid #ddd;"><span style="color: ${car.occupiedAvailable && car.occupiedAvailable.trim() ? '#27ae60' : '#7f8c8d'}">${car.occupiedAvailable && car.occupiedAvailable.trim() ? car.occupiedAvailable : '無'}</span></td>
                            `;
                            tbody.appendChild(tr);
                        });
                    } else {
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 15px; color: #95a5a6;">目前無登記車輛資料</td></tr>';
                    }

                    // 3. 隱藏報表區打開顯示」
                    document.getElementById('reportSection').style.display = 'block';

                } else {
                    alert('⚠️ 查詢失敗：' + (data.message || '後端查無此欄位資料！'));
                    document.getElementById('reportSection').style.display = 'none';
                }

            } catch (error) {
                console.error('[呼叫 API 發生錯誤]:', error);
                alert('❌ 無法連結後端服務: ' + error.message);
                document.getElementById('reportSection').style.display = 'none';
            }
        }
    }


    
    
    
    
    
    
    
    
    
    function goToUpdateCar(event) {
        // 阻止預設提交重新整理
        if (event && typeof event.preventDefault === 'function') {
            event.preventDefault();
        }

        const residentIdEl = document.getElementById('residentId');
        if (!residentIdEl) {
            alert('❌ 錯誤：網頁畫面上找不到 id 為 "residentId" 的元素！');
            return;
        }

        // 自動相容 input(value) 與 td/span(innerText) 的取值
        let residentId = '';
        if (residentIdEl.tagName === 'INPUT' || residentIdEl.tagName === 'SELECT' || residentIdEl.tagName === 'TEXTAREA') {
            residentId = residentIdEl.value.trim();
        } else {
            residentId = residentIdEl.innerText.trim();
        }

        if (!residentId) {
            alert('❌ 錯誤：無法從畫面中撈取「住戶代碼」（變數為空值）');
            return;
        }

        // 💡 修正：為門牌欄位增加防呆，自動相容輸入框(.value)與一般標籤(.innerText)
        const addressSimpleEl = document.getElementById('addressSimple');
        let addressSimpleVal = '';
        if (addressSimpleEl) {
            if (addressSimpleEl.tagName === 'INPUT' || addressSimpleEl.tagName === 'SELECT') {
                addressSimpleVal = addressSimpleEl.value.trim();
            } else {
                addressSimpleVal = addressSimpleEl.innerText.trim();
            }
        }

        // 打包輕量化認證物件 (此處的 Key 大小寫必須與你在後續網頁接收時點選的完全一致)
        const authData = {
            residentId: residentId,
            updateresident : 'updatecar',
            addresssimple : addressSimpleVal
        };  
        

        const apiUrl = `${API_BASE}/setsession`;

        	// ⚡ 核心修正：發送時務必加上 credentials: 'include' 鎖定會話 Cookie
            // 1. 確保在登入成功時，有執行這行把 token 存起來：
			// localStorage.setItem('my_jwt_token', token);
			// 2. 發送請求時，從儲存空間取出 token
			//const savedToken = localStorage.getItem('my_jwt_token');
			//alert(token)
        	fetch(apiUrl,  {  method: 'POST', 
			        	  headers: { 
			        	    'Content-Type': 'application/json;charset=UTF-8',
			        	    'Authorization': `Bearer ${token}` // 換頁後依然拿得到
			        	  },
			        	  body: JSON.stringify(authData)
			        	})
        // 2. 發送請求時，主動裝進 Header 送過去
		//fetch('/MyHomework0803/api/hello', {
		//    method: 'GET',
		//    headers: {
		//        'Authorization': `Bearer ${token}` // 🌟 圖片中的 authHeader 就是在拿這行！
		//    }
		//})
		//使用 Session (Cookie) 機制 ➔ 才需要加 credentials: 'include'。使用 JAX-RS + Bearer Token 機制 ➔ 不要加 credentials，只要確保每個 fetch 的 headers 都有放 'Authorization': 'Bearer ' + token 即可。
		
        
        .then(res => {
            if (!res.ok) {
                throw new Error(`HTTP 錯誤！狀態碼: ${res.status}`);
            }
            return res.json();
        })
        .then(data => {
            if (data && data.success) {
                console.log("後端 Session 寫入成功，準備跳轉。");
                window.location.href = 'updatecar.html';//vvvvvv
            } else {
                alert('❌ Session 寫入失敗：' + (data.message || '後端回傳 success 為 false'));
            }
        })
        .catch(err => {
            console.error("Fetch 過程中發生異常:", err);
            alert('❌ 連線失敗或後端拋出異常：' + err.message);
        });
    }

    
    

    
    
    
    
    
    
    
    
    
    
    
    
    function goToUpdatePage(event) {
        // 阻止可能存在的表單預設提交重新整理
        if (event && typeof event.preventDefault === 'function') {
            event.preventDefault();
        }

        const residentIdEl = document.getElementById('residentId');
        if (!residentIdEl) {
            alert('❌ 錯誤：網頁畫面上找不到 id 為 "residentId" 的元素！');
            return;
        }

        // 自動相容 input(value) 與 td/span(innerText) 的取值
        let residentId = '';
        if (residentIdEl.tagName === 'INPUT' || residentIdEl.tagName === 'SELECT' || residentIdEl.tagName === 'TEXTAREA') {
            residentId = residentIdEl.value.trim();
        } else {
            residentId = residentIdEl.innerText.trim();
        }

        if (!residentId) {
            alert('❌ 錯誤：無法從畫面中撈取「住戶代碼」（變數為空值）');
            return;
        }

        // 💡 修正：為門牌欄位增加防呆，自動相容輸入框(.value)與一般標籤(.innerText)
        const addressSimpleEl = document.getElementById('addressSimple');
        let addressSimpleVal = '';
        if (addressSimpleEl) {
            if (addressSimpleEl.tagName === 'INPUT' || addressSimpleEl.tagName === 'SELECT') {
                addressSimpleVal = addressSimpleEl.value.trim();
            } else {
                addressSimpleVal = addressSimpleEl.innerText.trim();
            }
        }

        const authData = {
            residentId: residentId,
            updateresident : 'updateresident',
            addresssimple : addressSimpleVal
        };  
        
        console.log("正在發送 Session 寫入請求，認證資料為：", authData);

        const apiUrl = `${API_BASE}/setsession`;
        fetch(apiUrl,  {  method: 'POST', 
			        	  headers: { 
			        	    'Content-Type': 'application/json;charset=UTF-8',
			        	    'Authorization': `Bearer ${token}` // 換頁後依然拿得到
			        	  },
			        	  body: JSON.stringify(authData)
			        	})
        .then(res => {
            if (!res.ok) {
                throw new Error(`HTTP 錯誤！狀態碼: ${res.status}`);
            }
            return res.json();
        })
        .then(data => {
            if (data && data.success) {
                console.log("後端 Session 寫入成功，準備跳轉。");
                window.location.href = 'update.html';
            } else {
                alert('❌ Session 寫入失敗：' + (data.message || '後端回傳 success 為 false'));
            }
        })
        .catch(err => {
            console.error("Fetch 過程中發生異常:", err);
            alert('❌ 連線失敗或後端拋出異常：' + err.message);
        });
    }

    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    //===載入門牌====
    async function loadDoorplateOptions() {
        const select = document.getElementById('doorplateSelect');
        const apiUrl = API_BASE + '/getresidentforcombobox';

        select.innerHTML = '<option value="">載入中...</option>';

        try {
            console.log('[門牌選單] 呼叫 API:', apiUrl);
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error('HTTP ' + response.status);
            
            const textData = await response.text();
            console.log('[門牌選單] 回傳資料:', textData);
            
            const items = textData.split(',')
                .map(s => s.trim())
                .filter(s => s !== '' && !s.includes('請選擇'));

            if (items.length === 0) throw new Error('門牌資料為空');

            select.innerHTML = '<option value="">請選擇門牌</option>';
            items.forEach(item => {
                const o = document.createElement('option');
                o.value = item;
                o.textContent = item;
                select.appendChild(o);
            });

        } catch (error) {
            console.error('[門牌選單] 載入失敗:', error);
            select.innerHTML = '<option value="">⚠️ 載入失敗</option>';
        }
    }
