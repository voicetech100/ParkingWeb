<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員清單維護</title>
    <style>
        /* 內建純 CSS 樣式 - 不需連網 */
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: #0d6efd;
            margin-bottom: 30px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            padding: 20px;
            margin-bottom: 25px;
        }
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .search-group {
            display: flex;
            gap: 5px;
        }
        input[type="text"], input[type="password"], input[type="tel"], select {
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }
        input[type="text"] { width: 250px; }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-query { background-color: #6c757d; color: white; }
        .btn-reset { background-color: #dc3545; color: white; }
        .btn-add { background-color: #198754; color: white; }
        .btn-gomain { background-color: #191701; color: white; }
        .btn-edit { background-color: #0d6efd; color: white; padding: 4px 10px; font-size: 12px; }
        .btn-delete { background-color: #dc3545; color: white; padding: 4px 10px; font-size: 12px; }
        .btn-save { background-color: #198754; color: white; }
        .btn-cancel { background-color: #6c757d; color: white; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }
        th { background-color: #f8f9fa; color: #495057; }
        tr:hover { background-color: #f1f3f5; }
        code { background-color: #f8f9fa; padding: 2px 6px; border-radius: 4px; color: #d63384; }
        
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: white;
            font-weight: bold;
        }
        .badge-1 { background-color: #0d6efd; }
        .badge-2 { background-color: #6c757d; }
        
        /* 彈出視窗樣式 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .modal-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 94%;
        }
        .modal-footer {
            margin-top: 20px;
            text-align: right;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>管理員清單維護</h2>

        <!-- 頂部操作列 -->
        <div class="card action-bar">
            <div class="search-group">
                <input type="text" id="searchKeyword" placeholder="輸入帳號、姓名或電話查詢...">
                <button class="btn-query" onclick="searchMember()">查詢</button>
                <button class="btn-reset" onclick="clearSearch()">重設</button>
            </div>
            
            <div>
                <button class="btn-add" onclick="openAddModal()">+ 新增管理員</button>
                <button class="btn-gomain" onclick="window.location.href='manager1.html'">+ 回首頁</button>
            </div>
            <label id="loginuser" class="mb-0 fw-bold text-secondary" style="margin-left: auto !important;">登入帳號</label>
        </div>

        <!-- 資料表格 -->
        <div class="card" style="padding: 0; overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>帳號 (Account)</th>
                        <th>密碼 (Password)</th>
                        <th>姓名 (Name)</th>
                        <th>電話 (Phone)</th>
                        <th>日期 (Date)</th>
                        <th>等級 (Class)</th>
                        <th style="text-align: center;">操作</th>
                    </tr>
                </thead>
                <tbody id="memberTableBody">
                    <!-- 資料由 JavaScript 從您的後端 API 撈取並動態渲染 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 彈出視窗 (Modal) -->
    <div class="modal-overlay" id="memberModal">
        <div class="modal-box">
            <div class="modal-header" id="modalTitle">新增管理員</div>
            <form id="memberForm" onsubmit="saveMember(event)">
                <!-- 隱藏欄位辨識更新模式 (儲存資料庫真實 ID) -->
                <input type="hidden" id="memberId">

                <div class="form-group">
                    <label>帳號</label>
                    <input type="text" id="account" required>
                </div>
                <div class="form-group">
                    <label>密碼</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>電話</label>
                    <input type="tel" id="phone" required>
                </div>
                <div class="form-group">
                    <label>日期</label>
                    <select id="class1">
                        <option value="1">等級 1</option>
                        <option value="2">等級 2</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn-save">儲存資料</button>
                </div>
            </form>
        </div>
    </div>







    <script>
    
    // 全域變數，存放後端取回的會員陣列
    let memberData = [];
    let bsModal;
    
    const token = localStorage.getItem("my_api_token");
    // 後端 API 網址設定
    const API_BASE = sessionStorage.getItem('API_BASE');
    let API_URL_GET = API_BASE + '/getallmanager'; // 供查詢全部管理員的網址(使用POST)
    const API_URL_CRUD = API_BASE + '/admcrud';    // 供新增、修改、刪除的網址
    
    window.onload = function() {
    	
        // 1. 檢查是否有管理員權限（class1 是否為 1）
        const userClass = sessionStorage.getItem('class1');
        if (sessionStorage.getItem('class1') !=1){
        	API_URL_GET = API_BASE + '/getmanager'; // 供查詢單一管理員的網址(使用POST)
        	//window.location.href = "manager1.html" // 沒有權限轉回manager1.html
        	//return ; // 在 window.onload函式內，使用 return 結束執行.
        }
    	
        document.getElementById("loginuser").innerHTML = "登入帳號: " + sessionStorage.getItem('account') + "&nbsp;&nbsp;&nbsp;[等級" + sessionStorage.getItem('class1') + "]";
    	bsModal = document.getElementById('memberModal');
        // 初始化：自動載入資料
        loadMembers();
    
    };
    
    
    
    // 【POST】使用超級管理員帳號取得所有管理員
    function loadMembers() {
        const account = sessionStorage.getItem('account');
		const password = sessionStorage.getItem('password');
        const managerPayload = {
            account: account,
            password: password 
        };
		//alert(API_URL_GET)
        //alert(token)
		fetch(API_URL_GET, {  //http://localhost:8080/parkingweb/api/hello/getallmanager
            method: 'POST', 
            headers: { 
                'Content-Type': 'application/json' ,
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(managerPayload) // 同步帶入帳密
        })
        .then(response => {
            if (!response.ok) throw new Error('無法與後端連線');
            return response.json();
        })
        .then(resObject => {
            // 解析包含 success 與 data 的傳回結構
            if (resObject.success) {
                memberData = resObject.data || [];
                renderTable(memberData);
            } else {
                alert("後端查詢失敗：" + (resObject.message || "未知錯誤"));
            }
        })
        .catch(error => {
            console.error("無資料或載入失敗:", error);
            alert("查無資料/無法載入資料！");
        });
    }
    
    
    

    // 將陣列資料渲染至表格
    function renderTable(data) {
        const tbody = document.getElementById('memberTableBody');
        tbody.innerHTML = '';
        
        if(!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#999; padding:30px;">目前資料庫無任何會員資料</td></tr>`;
            return;
        }

        data.forEach(item => {
            tbody.innerHTML += `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.account}</td>
                    <td><code>${item.password}</code></td>
                    <td>${item.name}</td>
                    <td>${item.phone}</td>
                    <td>${item.date}</td>
                    <td><span class="badge badge-${item.class1}">等級 ${item.class1}</span></td>
                    <td style="text-align: center;">
                        <button class="btn-edit" onclick="openEditModal(${item.id})">編輯</button>
                        <button class="btn-delete" onclick="deleteMember(${item.id})">刪除</button>
                    </td>
                </tr>
            `;
        });
    }

    // 前端關鍵字篩選功能
    function searchMember() {
        const keyword = document.getElementById('searchKeyword').value.trim().toLowerCase();
        const filtered = memberData.filter(item => 
            item.account.toLowerCase().includes(keyword) || 
            item.name.toLowerCase().includes(keyword) || 
            item.phone.includes(keyword)
        );
        renderTable(filtered);
    }

    function clearSearch() {
        document.getElementById('searchKeyword').value = '';
        renderTable(memberData);
    }

    // 開啟新增視窗
    function openAddModal() {
        if (sessionStorage.getItem('class1') != '1'){
    		alert("沒有權限,登入者等級需class 1 ,才能新增管理員");
    		return;
    	}
    	document.getElementById('modalTitle').innerText = '新增管理員';
        document.getElementById('memberForm').reset();
        document.getElementById('memberId').value = '';
        bsModal.style.display = 'flex';
    }

    // 開啟編輯視窗並自動填入資料 (依據資料庫真實 ID)
    function openEditModal(id) {
        document.getElementById('modalTitle').innerText = '更新會員資料 (ID: ' + id + ')';
        const member = memberData.find(item => item.id === id);
        
        if (member) {
            document.getElementById('memberId').value = member.id; 
            document.getElementById('account').value = member.account;
            document.getElementById('password').value = member.password;
            document.getElementById('name').value = member.name;
            document.getElementById('phone').value = member.phone;
            document.getElementById('class1').value = member.class1;
            bsModal.style.display = 'flex';
        }
    }

    
    
    // 關閉視窗
    function closeModal() {
        bsModal.style.display = 'none';
    }

    
    
    // 【新增/修改：POST / PUT】送出資料至後端
    function saveMember(event) {
        event.preventDefault();
        
        const id = document.getElementById('memberId').value;
        const payload = {
            account: document.getElementById('account').value,
            password: document.getElementById('password').value,
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            class1: document.getElementById('class1').value
        };

        let method = 'POST';
        let url = API_URL_CRUD;

        if (id) {
            method = 'PUT';
            url = `${API_URL_CRUD}/${id}`; //使用id更新
        }

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json', 
            		   'Authorization': `Bearer ${token}`	
            },
            body: JSON.stringify(payload)
        })
        .then(response => {
            if(response.ok) {
                alert(id ? '會員資料更新成功！' : '新會員已成功寫入！');
                closeModal();
                loadMembers(); // 重新向後端發送 POST 查詢最新狀態
            } else {
                alert('傳輸失敗，請檢查欄位或後端伺服器接收狀態。');
            }
        })
        .catch(error => console.error("傳輸發生錯誤:", error));
    }

    
    
    
    
    
    
    
    
    
    
    // 【刪除：DELETE】通知後端刪除指定ID資料
    function deleteMember(id) {
    	// 1.定位表格的所有資料列tr
    	const rows = document.querySelectorAll('table tr');
    	const memberData = [];
    	rows.forEach((row, index) => {
    	    if (index === 0) return; 
    	    const cells = row.querySelectorAll('td');
    	    // 確保有欄位資料
    	    if (cells.length > 0) {
    	    	const currentId = cells[0]?.innerText.trim();
    	    	if (currentId === id.toString()){
	    	    	const item = {
	    	            id: cells[0]?.innerText.trim(),
	    	            account: cells[1]?.innerText.trim(),
	    	            password: cells[2]?.innerText.trim(),
	    	            name: cells[3]?.innerText.trim(),
	    	            phone: cells[4]?.innerText.trim(),
	    	            date: cells[5]?.innerText.trim(),
	    	            class1: cells[6]?.innerText.trim()
	    	            //第8個欄位是操作按鈕（編輯/刪除）不需要抓取
  	    	        };
	    	    	memberData.push(item); 
    	    	}
    	    }
    	});
    	const payload = memberData;  // memberData 是一個陣列 [ { ... } ]
        //alert("準備刪除帳號：" + (payload[0]?.account || "未知"));	
        if (confirm('確定要從資料庫完全刪除 ID 為 ' + id + ' 的會員嗎？')) {
        	fetch(`${API_URL_CRUD}/${id}`, { 
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`//傳送JSON
                },
                body: JSON.stringify(payload[0]) //配合後端須為{},不可為[{},{}...]
            })
            .then(response => {
                if(response.ok) {
                    alert('刪除成功！');
                    if (sessionStorage.getItem('class1') != "1") {
                    	//sessionStorage.removeItem('class1'); 
                        window.location.href = "login.html";
                        }
                    loadMembers(); // 重新發送 POST 查詢刷洗列表
                } else {
                    alert('刪除失敗！');
                }
            })
            .catch(error => console.error("刪除失敗:", error));
        }
    }


    
    </script>
    
    </body>
    
    </html>
