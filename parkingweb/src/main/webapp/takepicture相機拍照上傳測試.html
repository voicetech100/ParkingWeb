<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>JAX-RS 相機測試</title>
</head>
<body>
    <h2>Java JAX-RS 相機拍照上傳測試</h2>
    <video id="video" width="400" height="300" autoplay playsinline style="background:#ccc;"></video>
    <br><br>
    <button id="captureBtn">點擊：拍照並傳送給 Java 後端</button>
    <canvas id="canvas" width="400" height="300" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');

        // 1. 啟動相機
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("相機啟動失敗，請檢查權限或是否使用 localhost 開啟。"); });

        // 2. 拍照與 REST 請求
        captureBtn.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('photo', blob, 'test_camera.jpg');

                try {
                    // 呼叫你的 Java REST API
                    
                    const response = await fetch('http://localhost:8080/MyHomework0803/api/entry/photos', {
                        method: 'POST',
                        body: formData
                    });

                    if (response.status === 201) {
                        const result = await response.json();
                        alert(`上傳成功！\n照片 ID: ${result.id}\n資源網址: ${result.resource_url}`);
                        console.log("後端回傳：", result);
                    } else {
                        alert(`上傳失敗，HTTP 狀態碼: ${response.status}`);
                    }
                } catch (error) {
                    alert("連線失敗，請檢查 Java 後端是否啟動，或是否有跨網域 (CORS) 問題。");
                }
            }, 'image/jpeg');
        });
    </script>
</body>
</html>
