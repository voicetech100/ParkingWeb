<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>JAX-RS 相機測試（自動上傳版）</title>
    <style>
        .preview-container {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        .box {
            width: 400px;
            height: 300px;
            background: #ccc;
            border: 2px dashed #999;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .box.dragover {
            border-color: #28a745;
            background-color: #e8f5e9;
        }
        #mockImg {
            max-width: 100%;
            max-height: 100%;
            display: none;
        }
        /* 狀態與進度條樣式 */
        .status-container {
            margin-top: 15px;
            padding: 10px;
            width: 400px;
            border-radius: 4px;
            background: #f8f9fa;
            border: 1px solid #ddd;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
            display: none;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: #007bff;
            transition: width 0.2s ease;
        }
        .success-text { color: #28a745; font-weight: bold; }
        .error-text { color: #dc3545; font-weight: bold; }
        .loading-text { color: #007bff; }
    </style>
</head>
<body>

    <h2>Java JAX-RS 圖片拖曳即時上傳測試</h2>
    <div class="preview-container">
        <!-- 拖曳模擬區域（此處改為主要操作區） -->
        <div>
            <h4>將圖片拖曳至下方，或點擊選取檔案（放開即自動上傳）</h4>
            <div id="dropZone" class="box">
                <span id="dropText">拖曳圖片到這裡自動上傳</span>
                <img id="mockImg" alt="預覽圖">
            </div>
            <input type="file" id="fileInput" accept="image/*" style="margin-top: 5px;">
            
            <!-- 上傳狀態與進度顯示區 -->
            <div class="status-container">
                <div>目前狀態：<span id="uploadStatus">等待檔案輸入...</span></div>
                <div id="progressContainer" class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div id="resultDetails" style="margin-top: 5px; font-size: 14px; white-space: pre-line;"></div>
            </div>
        </div>

        <!-- 隱藏不常用的真實相機畫面，若需要仍可在後台運作 -->
        <div style="display: none;">
            <video id="video" width="400" height="300" autoplay playsinline></video>
        </div>
    </div>

    <!-- 用於調整圖片大小或轉換格式的隱藏畫布 -->
    <canvas id="canvas" width="400" height="300" style="display:none;"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const dropZone = document.getElementById('dropZone');
        const dropText = document.getElementById('dropText');
        const mockImg = document.getElementById('mockImg');
        const fileInput = document.getElementById('fileInput');

        // 狀態顯示相關元件
        const uploadStatus = document.getElementById('uploadStatus');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const resultDetails = document.getElementById('resultDetails');

        // 1. 處理圖片載入與即時上傳
        function handleImageFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                updateStatus('請選取正確的圖片檔案！', 'error-text');
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                mockImg.src = e.target.result;
                mockImg.style.display = 'block';
                dropText.style.display = 'none';
                
                // 圖片載入完成後，立刻繪製到 Canvas 並啟動上傳
                mockImg.onload = () => {
                    uploadImageToServer();
                };
            };
            reader.readAsDataURL(file);
        }

        // 2. 執行上傳請求 (包含進度條與狀態更新)
        function uploadImageToServer() {
            const context = canvas.getContext('2d');
            context.drawImage(mockImg, 0, 0, canvas.width, canvas.height);

            updateStatus('正在準備檔案...', 'loading-text', true);
            resultDetails.innerText = '';

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('photo', blob, 'drag_upload.jpg');

                try {
                    updateStatus('正在上傳至後端...', 'loading-text');
                    
                    // 使用 XMLHttpRequest 以便精準監聽真實的上傳百分比進度
                    const xhr = new XMLHttpRequest();
                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const percent = Math.round((e.loaded / e.total) * 100);
                            progressFill.style.width = percent + '%';
                            updateStatus(`正在上傳... (${percent}%)`, 'loading-text');
                        }
                    });

                    xhr.onreadystatechange = () => {
                        if (xhr.readyState === 4) { // 請求完成
                            if (xhr.status === 201) {
                                const result = JSON.parse(xhr.responseText);
                                updateStatus('上傳成功！', 'success-text');
                                
                                // 📍 修改處：將後端回傳的車牌號碼 (result.license_plate) 顯示到網頁畫面上
                                resultDetails.innerHTML = `🚗 <strong style="color:#007bff; font-size:16px;">辨識車牌: ${result.license_plate || "未辨識出車牌"}</strong>\n照片 ID: ${result.id}\n資源網址: ${result.resource_url}`;
                                console.log("後端回傳：", result);
                            } else {
                                updateStatus(`上傳失敗`, 'error-text');
                                resultDetails.innerText = `HTTP 狀態碼: ${xhr.status}`;
                            }
                            hideProgressBar();
                        }
                    };

                    xhr.onerror = () => {
                        updateStatus('連線失敗', 'error-text');
                        resultDetails.innerText = '請檢查 Java 後端是否啟動，或是否有跨網域 (CORS) 問題。';
                        hideProgressBar();
                    };

                    xhr.open('POST', 'http://localhost:8080/MyHomework0803/api/entry/photos');
                    xhr.send(formData);

                } catch (error) {
                    updateStatus('發生非預期錯誤', 'error-text');
                    hideProgressBar();
                }
            }, 'image/jpeg');
        }

        // 3. 輔助函式：更新介面狀態
        function updateStatus(text, className, showBar = false) {
            uploadStatus.innerText = text;
            uploadStatus.className = className;
            if (showBar) {
                progressContainer.style.display = 'block';
                progressFill.style.width = '0%';
            }
        }

        function hideProgressBar() {
            setTimeout(() => {
                progressContainer.style.display = 'none';
            }, 1000); // 延遲 1 秒後隱藏進度條，優化視覺體驗
        }

        // 4. 拖曳事件監聽 (Drag and Drop)
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0]; // 取得第一個檔案
            handleImageFile(file);
        });

        // 5. 檔案選取器監聽
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            handleImageFile(file);
        });
    </script>
</body>
</html>
